[project]
name = "ingresos_egresos"
authors = [
    { name = "Ernesto Ruiz", email = "eruiz@wbapps.ocm"}
]
description = "App para llevar control de Ingresos y Egresos"
requires-python = ">=3.14,<3.15"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "erpnext>=16.50.0,<17.0.0"
    # Frappe is installed and managed by bench (v16.50+).
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"
